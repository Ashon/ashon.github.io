{{- /* Adds a hidden anchor link to every heading in .Content.
       aria-hidden content must not be focusable, so the link is also
       taken out of the tab order (tabindex="-1"); keyboard users reach
       sections through the TOC instead. */ -}}
{{ . | replaceRE
    "(<h[1-6] id=\"([^\"]+)\".+)(</h[1-6]+>)"
    "${1}<a class=\"anchor\" aria-hidden=\"true\" tabindex=\"-1\" href=\"#${2}\">#</a>${3}"
    | safeHTML
}}
