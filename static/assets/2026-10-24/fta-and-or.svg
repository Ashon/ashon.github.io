<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 324" class="fp2" role="img" aria-labelledby="fp2-title fp2-desc">
  <title id="fp2-title">두 개 있는 부품은 AND 아래에, 하나뿐인 부품은 OR 아래에 바로 그리기</title>
  <desc id="fp2-desc">서버가 작업을 수행할 수 없음은 OR 게이트로 전원 상실과 팬 고장으로 나뉜다. 전원 상실은 AND 게이트 아래에 PSU-A 고장과 PSU-B 고장이 있어서 둘 다 일어나야 위로 번진다. 팬은 하나뿐이라 팬 고장이 OR 게이트 아래에 바로 붙고, 고장 나면 바로 위로 번진다.</desc>
  <style>
    .fp2 { font-family: inherit; }
    .fp2-line { fill: none; stroke: var(--secondary, #6c6c6c); stroke-width: 1.5; }
    .fp2-event { fill: var(--theme, #fff); stroke: var(--primary, #1e1e1e); stroke-width: 1.5; }
    .fp2-gate { fill: var(--code-bg, #f5f5f5); stroke: var(--primary, #1e1e1e); stroke-width: 1.5; }
    .fp2-text { fill: var(--primary, #1e1e1e); font-size: 13px; text-anchor: middle; dominant-baseline: central; }
    .fp2-call { fill: var(--primary, #1e1e1e); font-size: 12.5px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    .fp2-call-small { fill: var(--secondary, #6c6c6c); font-size: 12px; text-anchor: middle; dominant-baseline: central; }
    .fp2-call-accent { fill: var(--accent, #1f6fd1); font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    .fp2-sep { fill: none; stroke: var(--border, #e8e8e8); stroke-width: 1; }
    .fp2-gate-label { fill: var(--secondary, #6c6c6c); font-size: 9px; font-weight: 600; text-anchor: middle; dominant-baseline: central; letter-spacing: 0.04em; }
  </style>

  <!-- top event and OR gate -->
  <rect class="fp2-event" x="70" y="12" width="220" height="32" rx="6" />
  <text class="fp2-text" x="180" y="28">서버가 작업을 수행할 수 없음</text>
  <path class="fp2-line" d="M180 44 V54" />
  <path class="fp2-gate" d="M162 82 Q180 72 198 82 Q196 62 180 54 Q164 62 162 82 Z" />
  <text class="fp2-gate-label" x="180" y="71">OR</text>
  <path class="fp2-line" d="M180 78 V90 M110 90 H290 M110 90 V102 M290 90 V196" />

  <!-- two PSUs: AND -->
  <rect class="fp2-event" x="55" y="102" width="110" height="30" rx="6" />
  <text class="fp2-text" x="110" y="117">전원 상실</text>
  <path class="fp2-gate" d="M92 168 V154 A18 14 0 0 1 128 154 V168 Z" />
  <text class="fp2-gate-label" x="110" y="160">AND</text>
  <path class="fp2-line" d="M110 132 V140 M110 168 V180 M60 180 H160 M60 180 V196 M160 180 V196" />
  <circle class="fp2-event" cx="60" cy="214" r="18" />
  <text class="fp2-text" x="60" y="246">PSU-A 고장</text>
  <circle class="fp2-event" cx="160" cy="214" r="18" />
  <text class="fp2-text" x="160" y="246">PSU-B 고장</text>

  <!-- one fan: straight under OR -->
  <circle class="fp2-event" cx="290" cy="214" r="18" />
  <text class="fp2-text" x="290" y="246">팬 고장</text>

  <!-- what each side means -->
  <path class="fp2-sep" d="M10 264 H350" />
  <text class="fp2-call" x="110" y="280">PSU가 두 개</text>
  <text class="fp2-call-small" x="110" y="297">둘 다 죽어야 위로 번짐</text>
  <text class="fp2-call-accent" x="110" y="314">-> AND</text>
  <text class="fp2-call" x="290" y="280">팬이 하나뿐</text>
  <text class="fp2-call-small" x="290" y="297">고장 나면 바로 번짐</text>
  <text class="fp2-call-accent" x="290" y="314">-> OR 아래에 바로</text>
</svg>
